# Compile check on every push: assembles the unsigned github-flavor debug APK so code
# changes are build-verified in the cloud (development environments can't always run
# Gradle locally). Releases are publish.yml's job — this never publishes anything.
name: Build check

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run unit tests
        run: gradle -p . :app:testGithubDebugUnitTest

      - name: Assemble debug APK
        run: gradle -p . :app:assembleGithubDebug

  # The rendering tests (app/src/androidTest). These need a real Android device because the bugs
  # they exist for are MEASUREMENT bugs: a button under the keyboard, a label clipped at a large
  # system font, a block screen whose "Got it" has been pushed off the bottom. None of them exist
  # until something has been laid out against a real width, height, density and font scale, so no
  # JVM test can ever have them — which is why eighteen releases went out in five days with the
  # owner finding them one at a time on his phone.
  #
  # Booting an emulator costs ~10 minutes, so this does not run on every push to a working branch.
  # It runs where it matters: on master, on demand, and as the gate in front of every release
  # (see publish.yml, which will not build an APK until this has passed).
  rendering:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Without this the emulator falls back to software rendering and takes several times as
      # long — GitHub's ubuntu runners expose KVM but not, by default, to the runner's user.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run rendering tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # swangle_indirect, NOT swiftshader_indirect. With SwiftShader the emulator process
          # *died* part-way through the run — "Failed to start Emulator console", "device
          # emulator-5554 not found", "Expected 12 tests, received 7" — and always on the same
          # test. The tests that only measure views survive it (they never reach a draw pass);
          # the one that draws FrictionGate full-screen does not, and that screen paints a
          # full-screen radial-gradient shader. A renderer crash, not a failing assertion, which
          # is why its recorded failure had no message at all.
          emulator-options: >-
            -no-window -gpu swangle_indirect -noaudio -no-boot-anim
            -no-snapshot -camera-back none
          disable-animations: true
          script: gradle -p . :app:connectedGithubDebugAndroidTest

      # The failure message names the layout, theme and screen size that broke, and that is the
      # whole diagnostic — but only if it survives the run.
      - name: Keep the test report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rendering-test-report
          # Both, and the second one is the important one: the HTML report says which test failed
          # but not WHY, and the assertion message is the entire diagnostic here — it names the
          # layout, theme and screen size, or the height the paragraph collapsed to. The XML
          # results carry it; the HTML does not.
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
